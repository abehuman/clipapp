name: Release

on:
  push:
    tags:
    - 'v*.*.*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout release tag
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Validate tag and version
      id: version
      shell: zsh {0}
      run: |
        set -euo pipefail
        git fetch origin main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          print -u2 "Release tag must point to a commit on origin/main."
          exit 65
        fi

        version=$(scripts/validate-release-version.sh "$GITHUB_REF_NAME")
        main_appcast="$RUNNER_TEMP/main-appcast.xml"
        git show origin/main:docs/appcast.xml > "$main_appcast"
        scripts/validate-release-version.sh "$GITHUB_REF_NAME" "$main_appcast" >/dev/null

        live_appcast="$RUNNER_TEMP/live-appcast.xml"
        curl --fail --location --retry 3 \
          --output "$live_appcast" \
          https://abehuman.github.io/clipapp/appcast.xml
        scripts/validate-release-version.sh "$GITHUB_REF_NAME" "$live_appcast" >/dev/null
        print -r -- "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .spm-cache
        key: release-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          release-spm-${{ runner.os }}-
          spm-${{ runner.os }}-

    - name: Run tests
      run: |
        xcodebuild \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -scheme ClipApp \
          -project ClipApp.xcodeproj \
          -destination 'platform=macOS' \
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-cache/SourcePackages" \
          -packageCachePath "$GITHUB_WORKSPACE/.spm-cache/PackageCache" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          test

  release:
    name: Sign, notarize, and publish
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: release
    permissions:
      contents: write
    outputs:
      version: ${{ needs.validate.outputs.version }}
      release_sha: ${{ github.sha }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - name: Checkout release tag
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Configure release paths
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' \
          "RELEASE_ROOT=$RUNNER_TEMP/clipapp-release" \
          "NOTARIZED_ROOT=$RUNNER_TEMP/clipapp-notarized" \
          "UPDATES_DIR=$RUNNER_TEMP/clipapp-release/updates" \
          "KEYCHAIN_PATH=$RUNNER_TEMP/clipapp-release.keychain-db" \
          "CERTIFICATE_PATH=$RUNNER_TEMP/developer-id.p12" \
          "ASC_KEY_PATH=$RUNNER_TEMP/app-store-connect-api-key.p8" \
          "SPARKLE_KEY_PATH=$RUNNER_TEMP/sparkle-private-key" \
          >> "$GITHUB_ENV"

    - name: Validate release credentials
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
        APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
      run: |
        set -euo pipefail
        required_variables=(
          APPLE_TEAM_ID
          APPLE_DEVELOPER_ID_P12_BASE64
          APPLE_DEVELOPER_ID_P12_PASSWORD
          APP_STORE_CONNECT_API_KEY_BASE64
          APP_STORE_CONNECT_API_KEY_ID
          APP_STORE_CONNECT_API_ISSUER_ID
          SPARKLE_PRIVATE_KEY_BASE64
        )

        missing_variables=()
        for variable_name in "${required_variables[@]}"; do
          if [[ -z "${!variable_name:-}" ]]; then
            missing_variables+=("$variable_name")
          fi
        done

        if (( ${#missing_variables[@]} > 0 )); then
          printf 'Missing release Environment values: %s\n' "${missing_variables[*]}" >&2
          exit 78
        fi

    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .spm-cache
        key: release-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          release-spm-${{ runner.os }}-
          spm-${{ runner.os }}-

    - name: Install release credentials
      shell: bash
      env:
        APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
        APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
      run: |
        set -euo pipefail
        mkdir -p "$RELEASE_ROOT" "$NOTARIZED_ROOT" "$UPDATES_DIR"

        printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
        printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
        printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode > "$SPARKLE_KEY_PATH"
        chmod 600 "$CERTIFICATE_PATH" "$ASC_KEY_PATH" "$SPARKLE_KEY_PATH"

        keychain_password=$(openssl rand -hex 32)
        echo "::add-mask::$keychain_password"
        security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" \
          -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
          -A \
          -t cert \
          -f pkcs12 \
          -k "$KEYCHAIN_PATH"
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k "$keychain_password" \
          "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"

        developer_id_count=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Developer ID Application' || true)
        if [[ $developer_id_count != 1 ]]; then
          echo "Expected exactly one Developer ID Application identity; found $developer_id_count." >&2
          exit 78
        fi

        developer_id_identity=$(
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            awk '/Developer ID Application/ { print $2 }'
        )
        echo "::add-mask::$developer_id_identity"
        printf 'DEVELOPER_ID_APPLICATION_IDENTITY=%s\n' \
          "$developer_id_identity" >> "$GITHUB_ENV"

        rm -f "$CERTIFICATE_PATH"

    - name: Build and notarize app
      shell: zsh {0}
      env:
        APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/app-store-connect-api-key.p8
      run: |
        set -euo pipefail
        scripts/build-notarized-app.sh \
          "$VERSION" \
          "$NOTARIZED_ROOT" \
          "$GITHUB_WORKSPACE/.spm-cache/SourcePackages"

    - name: Create notarized DMG and signed appcast
      shell: zsh {0}
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/app-store-connect-api-key.p8
        SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-private-key
      run: |
        set -euo pipefail
        app_path=$NOTARIZED_ROOT/export/ClipApp.app

        cp docs/appcast.xml "$UPDATES_DIR/appcast.xml"
        previous_update_url=$(
          xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@url)' \
            "$UPDATES_DIR/appcast.xml"
        )
        if [[ -n $previous_update_url ]]; then
          curl --fail --location --retry 3 \
            --output "$UPDATES_DIR/${previous_update_url:t}" \
            "$previous_update_url"
        fi

        scripts/create-release-dmg.sh "$app_path" "$VERSION" "$UPDATES_DIR"
        scripts/notarize-release-dmg.sh "$UPDATES_DIR/ClipApp-$VERSION.dmg"
        scripts/verify-release-dmg.sh \
          "$UPDATES_DIR/ClipApp-$VERSION.dmg" \
          "$VERSION"
        scripts/generate-appcast.sh \
          "$UPDATES_DIR" \
          "$VERSION" \
          "$GITHUB_WORKSPACE/.spm-cache/SourcePackages"

        generated_version=$(
          xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="shortVersionString"])' \
            docs/appcast.xml
        )
        generated_url=$(
          xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@url)' \
            docs/appcast.xml
        )
        generated_signature=$(
          xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
            docs/appcast.xml
        )
        expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/ClipApp-$VERSION.dmg"

        if [[ $generated_version != $VERSION || $generated_url != $expected_url || -z $generated_signature ]]; then
          print -u2 "Generated appcast entry is invalid."
          print -u2 "version=$generated_version url=$generated_url signature_present=$([[ -n $generated_signature ]] && print yes || print no)"
          exit 65
        fi

        update_archive="ClipApp-$VERSION.dmg"
        hdiutil verify "$UPDATES_DIR/$update_archive"

        release_assets=(
          "$UPDATES_DIR/$update_archive"
          "$UPDATES_DIR"/*.delta(N)
        )
        print -rl -- $release_assets > "$RELEASE_ROOT/release-assets.txt"
        (
          cd "$UPDATES_DIR"
          for asset in "${release_assets[@]}"; do
            shasum -a 256 "${asset:t}"
          done
        ) > "$RELEASE_ROOT/release-assets.sha256"

    - name: Save generated appcast
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-feed-${{ needs.validate.outputs.version }}
        path: docs/appcast.xml
        if-no-files-found: error
        retention-days: 30

    - name: Create or update draft release
      shell: zsh {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/ClipApp-$VERSION.dmg"
        release_intro=$(cat <<EOF
        ## Download

        [**Download ClipApp $VERSION for macOS**]($download_url)

        Requires macOS 13 Ventura or later.

        1. Download and open \`ClipApp-$VERSION.dmg\`.
        2. Drag \`ClipApp\` to the Applications folder in the window.
        3. Open ClipApp from Applications and grant Accessibility permission if macOS asks.

        Existing ClipApp users can also choose **Check for Updates…** from the app menu.

        <details>
        <summary>What are the other assets?</summary>

        - \`*.delta\` files are used automatically by Sparkle for smaller updates. You do not need to download them.
        - Source code archives are generated automatically by GitHub for developers.

        </details>
        EOF
        )

        release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
        if [[ -n $release_state && $release_state != true ]]; then
          print -u2 "A published release already exists for $GITHUB_REF_NAME; published assets must never be replaced."
          exit 73
        fi

        if [[ -z $release_state ]]; then
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "ClipApp $VERSION" \
            --generate-notes \
            --notes "$release_intro"
        else
          existing_assets=("${(@f)$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')}")
          for asset in $existing_assets; do
            [[ -n $asset ]] || continue
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
          done
        fi

        release_assets=("${(@f)$(<"$RELEASE_ROOT/release-assets.txt")}")
        gh release upload "$GITHUB_REF_NAME" $release_assets

    - name: Verify draft release assets
      shell: zsh {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        download_directory=$RELEASE_ROOT/downloaded-draft
        mkdir -p "$download_directory"
        gh release download "$GITHUB_REF_NAME" --dir "$download_directory"

        (
          cd "$download_directory"
          shasum -a 256 -c "$RELEASE_ROOT/release-assets.sha256"
        )

        scripts/verify-release-dmg.sh \
          "$download_directory/ClipApp-$VERSION.dmg" \
          "$VERSION"

    - name: Publish GitHub Release
      shell: zsh {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) == false ]]

    - name: Remove release credentials
      if: always()
      shell: bash
      run: |
        set +e
        rm -f "$CERTIFICATE_PATH" "$ASC_KEY_PATH" "$SPARKLE_KEY_PATH"
        security delete-keychain "$KEYCHAIN_PATH"

  persist_appcast:
    name: Record and publish Sparkle feed
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
    - name: Checkout latest main
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: main
        fetch-depth: 0

    - name: Download generated appcast
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-feed-${{ needs.release.outputs.version }}
        path: release-feed

    - name: Commit published appcast
      id: record
      env:
        RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        set -euo pipefail
        if ! git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
          echo 'The release commit is no longer an ancestor of main.' >&2
          exit 65
        fi

        cp release-feed/appcast.xml docs/appcast.xml
        if git diff --quiet -- docs/appcast.xml; then
          echo 'Published appcast is already recorded on main.'
        else
          git diff --check
          git add -- docs/appcast.xml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish ClipApp $VERSION update feed"
          git push origin HEAD:main
        fi

        published_sha=$(git rev-parse HEAD)
        echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"

    - name: Dispatch Pages deployment from main
      env:
        GH_TOKEN: ${{ github.token }}
        PUBLISHED_SHA: ${{ steps.record.outputs.published_sha }}
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        set -euo pipefail
        gh workflow run pages.yml \
          --repo "$GITHUB_REPOSITORY" \
          --ref main \
          -f expected_sha="$PUBLISHED_SHA" \
          -f expected_version="$VERSION"

    - name: Verify published Sparkle feed
      env:
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        set -euo pipefail
        live_appcast="$RUNNER_TEMP/live-appcast.xml"

        for attempt in {1..60}; do
          cache_buster="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
          if curl --fail --location --silent --show-error --retry 2 \
            --header 'Cache-Control: no-cache' \
            --output "$live_appcast" \
            "https://abehuman.github.io/clipapp/appcast.xml?release=$VERSION&verify=$cache_buster"; then
            if cmp --silent release-feed/appcast.xml "$live_appcast"; then
              echo "Published Sparkle feed matches ClipApp $VERSION."
              exit 0
            fi
          fi
          sleep 10
        done

        echo "Published Sparkle feed did not match ClipApp $VERSION within 10 minutes." >&2
        exit 1
